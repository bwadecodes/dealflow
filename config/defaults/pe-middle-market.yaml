# Dealflow Diligence Configuration
# Template: PE Middle Market
# Focus: Operational complexity, platform strategy, management depth, leverage
version: 1

rubric:
  categories:
    - name: "Product / Service"
      weight: high
      questions:
        - "What is the core value proposition — why do customers buy?"
        - "How diversified is the product/service portfolio?"
        - "What is the switching cost for customers?"
        - "Is the product evolving — what is the innovation cadence?"
        - "How defensible is the offering vs. well-capitalized competitors?"
        - "Are there adjacent product opportunities or white space?"

    - name: "Revenue"
      weight: high
      questions:
        - "What is the revenue mix (recurring vs. one-time, product vs. services, domestic vs. international)?"
        - "What is driving the growth rate — organic vs. acquisition-driven?"
        - "What does customer concentration look like — top 10 and top 20 as % of revenue?"
        - "What is net revenue retention by customer segment?"
        - "How does revenue break down by geography, channel, and business unit?"
        - "What is the visibility into the pipeline and contracted backlog?"

    - name: "Gross Margin"
      weight: high
      questions:
        - "What are gross margins by product line / business unit?"
        - "How has gross margin trended over the last 3-5 years?"
        - "What are the key COGS drivers and how sensitive are they to input costs?"
        - "What are the supply chain risks — concentration, single-source dependencies?"
        - "Are there margin expansion opportunities through procurement, automation, or mix shift?"
        - "How do margins compare to public and private comps?"

    - name: "Quality of Earnings"
      weight: high
      questions:
        - "What are the key QoE adjustments and how material are they?"
        - "How much of EBITDA is from recurring vs. non-recurring items?"
        - "What is the cash conversion of earnings?"
        - "Are there aggressive revenue recognition policies?"
        - "What are the normalized CapEx and working capital requirements?"
        - "How does adjusted EBITDA reconcile to cash flow from operations?"

    - name: "Operational Complexity"
      weight: high
      questions:
        - "How many locations, business units, or operating entities are there?"
        - "What ERP/systems infrastructure is in place — is it scalable?"
        - "Where are the operational bottlenecks?"
        - "What does the supply chain look like end-to-end?"
        - "How dependent is the operation on manual processes vs. automation?"
        - "What does the IT and cybersecurity posture look like?"

    - name: "Platform / M&A Strategy"
      weight: high
      questions:
        - "Is this a platform investment? What is the buy-and-build thesis?"
        - "What does the acquisition pipeline look like — targets, multiples, integration plans?"
        - "What is the track record of prior acquisitions — synergies realized vs. projected?"
        - "What is the integration playbook — people, systems, go-to-market?"
        - "Are there dis-synergies or cultural risks from bolt-on acquisitions?"
        - "How fragmented is the market — what is the consolidation opportunity?"

    - name: "Leverage / Capital Structure"
      weight: high
      questions:
        - "What is the proposed capital structure — total leverage, senior vs. sub?"
        - "What are the debt terms — covenants, maturity, prepayment?"
        - "How does the leverage compare to sponsor-backed comps?"
        - "What is the debt service coverage ratio under base and downside cases?"
        - "What is the free cash flow available for debt paydown?"
        - "What are the refinancing risks?"

    - name: "Team / Management"
      weight: high
      questions:
        - "How deep is the management bench — can the business run without the CEO?"
        - "What is the management team's background operating businesses of this scale?"
        - "What are the key hires needed post-close?"
        - "What are the management incentive structures — rollover equity, options, earnouts?"
        - "How does management handle the transition from founder/family-led to institutional ownership?"
        - "What is the quality of middle management and functional leadership?"

    - name: "Market / Competitors"
      weight: high
      questions:
        - "What is the total addressable market and how was it sized?"
        - "Who are the key competitors — their scale, margins, and positioning?"
        - "What is the competitive moat — brand, scale, contracts, regulation?"
        - "What does M&A activity look like in the sector — strategic and financial buyers?"
        - "What are the key market risks — regulatory, technology, macro cycle?"
        - "What are the exit options — strategic sale, secondary, IPO?"

    - name: "Legal / Regulatory"
      weight: medium
      questions:
        - "Any pending or threatened litigation — what is the exposure?"
        - "What IP does the company own and is it defensible?"
        - "Are key contracts (customer, vendor, employee) assignable on change of control?"
        - "What is the regulatory environment — are there compliance obligations?"
        - "Any environmental liabilities or exposure?"
        - "What does the insurance program look like — gaps or concerns?"

buy_box:
  revenue_range: "$75M - $250M"
  ebitda_range: "$15M - $50M"
  stage: "Established, scaled"
  ownership_target: "Control (51-100%)"
  sector_focus:
    - "business services"
    - "technology-enabled services"
    - "healthcare services"
    - "industrial / manufacturing"
    - "financial services"
    - "consumer"
  profitability: "EBITDA positive, stable margins"
  hold_period: "4-6 years"

preferences:
  output_dir: "dd-reports"
  report_format: "both"
  detail_level: "deep"
  auto_save: true
